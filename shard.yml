name: dir-walk
version: 0.1.0

description: |
  A fast, parallel file system walker for Crystal, ported from
  github.com/charlievieth/fastwalk. Walks directory trees concurrently
  using raw getdents syscalls where available.

  Requires -Dpreview_mt for multi-threaded parallel walking.

authors:
  - Dominic Sisneros <dsisnero@gmail.com>

crystal: '>= 1.20.2'

license: MIT

dependencies:

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.6.0
